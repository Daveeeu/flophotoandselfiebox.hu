services:
  app:
    image: ${APP_IMAGE:-flophotoandselfiebox:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${APP_PORT:-8086}:80"
    volumes:
      - ${APP_STORAGE_PATH:-./storage-persist}:/var/www/html/storage
      - ${APP_BOOTSTRAP_CACHE_PATH:-./bootstrap-cache-persist}:/var/www/html/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.flophoto.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.flophoto.entrypoints=websecure
      - traefik.http.routers.flophoto.tls.certresolver=letsencrypt
      - traefik.http.services.flophoto.loadbalancer.server.port=80
    networks:
      - traefik-public
      - platform

networks:
  traefik-public:
    external: true
  platform:
    external: true
